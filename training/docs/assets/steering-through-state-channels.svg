<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 715" width="900" height="715" font-family="Segoe UI, Arial, sans-serif">
  <title>Causal GPT-RL — Shaping Behavior Through State</title>
  <desc>What the model conditions on is a cache it keeps, not a message it is sent. The cache holds two groups: the action half, which the model writes itself, and the state half, which is yours to compose — you, the developer, put an action mask and an instruction into it while the environment supplies the observation. The parts are coloured by where each came from, and every source arrows into the exact slot it fills. One line carries no arrowhead — the cache's link to the model — because the model is attached to the cache rather than sent it. Emitting an action and keeping it are the same move, which is why an action always comes out and why its output cannot be masked. Keeping the action legal is therefore the adapter's job on your side, and it then reaches the world, which returns the next observation.</desc>
  <rect width="900" height="715" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="450" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#404040">Shaping Behavior Through <tspan fill="#6b4f9e">State</tspan></text>

  <!-- ================= THE MODEL CACHE (drawn first; everything lands on it) ================= -->
  <rect x="400" y="180" width="220" height="262" rx="18" fill="#f7f4fb" stroke="#c4a7e7" stroke-width="2"/>
  <text x="510" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">Model Cache</text>

  <!-- group: action — the model writes this half -->
  <text x="422" y="240" text-anchor="start" font-size="13" font-weight="700" fill="#9a6a1e">action</text>
  <rect x="422" y="246" width="176" height="32" rx="16" fill="#f6c68a"/>
  <text x="510" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2b2b">actions</text>

  <!-- group: state — yours to compose -->
  <text x="422" y="312" text-anchor="start" font-size="13" font-weight="700" fill="#6b4f9e">state</text>
  <rect x="422" y="318" width="176" height="32" rx="16" fill="#6b4f9e"/>
  <text x="510" y="340" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">action mask</text>

  <rect x="422" y="356" width="176" height="32" rx="16" fill="#6b4f9e"/>
  <text x="510" y="378" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">instruction</text>

  <rect x="422" y="394" width="176" height="32" rx="16" fill="#c4a7e7"/>
  <text x="510" y="416" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2b2b">observation</text>

  <text x="510" y="470" text-anchor="middle" font-size="15" font-style="italic" fill="#8a8a8a">the context the model reads</text>

  <!-- ================= SOURCE: YOU ================= -->
  <rect x="40" y="120" width="180" height="70" rx="16" fill="#ffffff" stroke="#404040" stroke-width="2.5"/>
  <text x="130" y="163" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">Developer</text>

  <path d="M220 155 H 320 V 372" fill="none" stroke="#6b4f9e" stroke-width="3"/>
  <path d="M320 334 H 412" fill="none" stroke="#6b4f9e" stroke-width="3"/>
  <polygon points="422,334 410,328 410,340" fill="#6b4f9e"/>
  <path d="M320 372 H 412" fill="none" stroke="#6b4f9e" stroke-width="3"/>
  <polygon points="422,372 410,366 410,378" fill="#6b4f9e"/>
  <text x="330" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4f9e">state you control</text>

  <!-- ================= SOURCE: ENVIRONMENT ================= -->
  <rect x="40" y="375" width="180" height="70" rx="16" fill="#ffffff" stroke="#404040" stroke-width="2.5"/>
  <text x="130" y="418" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">Environment</text>

  <path d="M220 410 H 412" fill="none" stroke="#a98fd0" stroke-width="3"/>
  <polygon points="422,410 410,404 410,416" fill="#a98fd0"/>
  <text x="308" y="398" text-anchor="middle" font-size="16" font-weight="700" fill="#8f6fbf">state from env</text>

  <!-- ================= CACHE -> MODEL (attached, not sent) ================= -->
  <path d="M620 300 H 680" fill="none" stroke="#8f6fbf" stroke-width="3"/>

  <!-- ================= THE MODEL ================= -->
  <rect x="680" y="260" width="180" height="80" rx="16" fill="#404040"/>
  <text x="770" y="308" text-anchor="middle" font-size="21" font-weight="700" fill="#ffffff">Causal GPT-RL</text>

  <!-- emitted and kept in the same move -->
  <path d="M770 340 V 512" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="770,522 763,509 777,509" fill="#c98a2e"/>
  <path d="M770 380 H 855 Q875 380 875 360 V 175 Q875 155 855 155 H 670 Q650 155 650 175 V 242 Q650 262 630 262 H 610" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="598,262 610,256 610,268" fill="#c98a2e"/>
  <circle cx="770" cy="380" r="5" fill="#c98a2e"/>
  <text x="762" y="143" text-anchor="middle" font-size="15" font-style="italic" font-weight="600" fill="#9a6a1e">kept as history</text>

  <!-- ================= ACTION ================= -->
  <circle cx="770" cy="554" r="32" fill="#f6c68a"/>
  <text x="770" y="565" text-anchor="middle" font-size="27" font-style="italic" fill="#2b2b2b">a</text>
  <text x="770" y="612" text-anchor="middle" font-size="15" font-weight="600" fill="#9a6a1e">always emitted</text>

  <path d="M738 554 H 684" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="672,554 684,548 684,560" fill="#c98a2e"/>

  <!-- ================= ADAPTER ================= -->
  <rect x="502" y="518" width="170" height="72" rx="16" fill="#f0f0f2" stroke="#b8b8be" stroke-width="2.5"/>
  <text x="587" y="550" text-anchor="middle" font-size="19" font-weight="700" fill="#404040">Adapter</text>
  <text x="587" y="572" text-anchor="middle" font-size="13" fill="#8a8a8a">your side</text>

  <!-- ================= BACK TO THE WORLD ================= -->
  <path d="M502 554 H 150 Q130 554 130 534 V 465" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="130,453 122,467 138,467" fill="#c98a2e"/>
  <text x="318" y="542" text-anchor="middle" font-size="16" font-style="italic" font-weight="600" fill="#9a6a1e">the action reaches the world</text>

  <!-- ================= CAPTION ================= -->
  <text x="450" y="648" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">What you add to the state is how you steer.</text>
  <text x="450" y="678" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">But state only informs — enforcing is the adapter's job.</text>
</svg>
