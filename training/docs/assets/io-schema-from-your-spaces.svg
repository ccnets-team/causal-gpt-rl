<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="Segoe UI, Arial, sans-serif">
  <title>Causal GPT-RL — I/O Schema Construction</title>
  <desc>Build-time I/O schema construction: the observation and action spaces declared by your Minari dataset are turned into a DataSpec schema, and that schema fixes the model's input and output specs. The action space feeds both sides, which is why its box carries both colours.</desc>
  <rect width="800" height="620" fill="#ffffff"/>

  <defs>
    <!-- Action space feeds BOTH input (purple) and output (orange) -->
    <linearGradient id="spaceActionStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#f6c68a"/>
    </linearGradient>
    <linearGradient id="spaceActionFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2ebfa"/>
      <stop offset="1" stop-color="#fdf1e0"/>
    </linearGradient>
  </defs>

  <text x="400" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#6b4f9e">I/O schema construction</text>
  <text x="400" y="70" text-anchor="middle" font-size="13.5" font-weight="600" fill="#404040">Minari offline dataset spaces → DataSpec schema → Model I/O heads at build-time</text>

  <rect x="310" y="96" width="180" height="60" rx="14" fill="#f0f0f2" stroke="#b8b8be" stroke-width="2"/>
  <text x="400" y="121" text-anchor="middle" font-size="17" font-weight="700" fill="#404040">Your Dataset</text>
  <text x="400" y="141" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Minari offline</text>

  <path d="M400 156 V 174 H 222.5 V 184" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M400 174 H 577.5 V 184" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="222.5,196 215.5,182 229.5,182" fill="#404040"/>
  <polygon points="577.5,196 570.5,182 584.5,182" fill="#404040"/>

  <rect x="60" y="196" width="325" height="62" rx="14" fill="#f7f4fb" stroke="#c4a7e7" stroke-width="2"/>
  <text x="222.5" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4f9e">Observation Space</text>
  <text x="222.5" y="242" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Box · Discrete · Dict …</text>

  <rect x="415" y="196" width="325" height="62" rx="14" fill="url(#spaceActionFill)" stroke="url(#spaceActionStroke)" stroke-width="2"/>
  <text x="577.5" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a1e">Action Space</text>
  <text x="577.5" y="242" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Box · Discrete · MultiDiscrete · MultiBinary …</text>

  <path d="M222.5 258 V 276 H 577.5 V 258" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M400 276 V 286" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="400,298 393,284 407,284" fill="#404040"/>

  <rect x="290" y="298" width="220" height="74" rx="18" fill="#404040"/>
  <text x="400" y="328" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">schema</text>
  <text x="400" y="350" text-anchor="middle" font-size="13.5" fill="#c9c9c9">Gym SpaceSpec → DataSpec</text>

  <path d="M400 372 V 390 H 222.5 V 400" fill="none" stroke="#8f6fbf" stroke-width="3"/>
  <polygon points="222.5,412 215.5,398 229.5,398" fill="#8f6fbf"/>
  <path d="M400 390 H 577.5 V 400" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="577.5,412 570.5,398 584.5,398" fill="#c98a2e"/>

  <rect x="60" y="412" width="325" height="62" rx="14" fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2"/>
  <text x="222.5" y="437" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4f9e">Input spec</text>
  <text x="222.5" y="458" text-anchor="middle" font-size="13.5" fill="#8a8a8a">state · action · bos</text>

  <rect x="415" y="412" width="325" height="62" rx="14" fill="#fdf1e0" stroke="#f6c68a" stroke-width="2"/>
  <text x="577.5" y="437" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a1e">Output spec</text>
  <text x="577.5" y="458" text-anchor="middle" font-size="13.5" fill="#8a8a8a">next action · next value · termination</text>

  <path d="M222.5 474 V 492 H 577.5 V 474" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M400 492 V 502" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="400,514 393,500 407,500" fill="#404040"/>

  <rect x="315" y="514" width="170" height="74" rx="18" fill="#404040"/>
  <text x="400" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Model</text>
  <text x="400" y="566" text-anchor="middle" font-size="13.5" fill="#c9c9c9">Causal GPT-RL θ</text>
</svg>
