<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" font-family="Segoe UI, Arial, sans-serif">
  <title>Causal GPT-RL — I/O Schema Construction</title>
  <desc>Build-time I/O schema construction: the observation and action spaces declared by your Minari dataset are turned into a DataSpec schema, and that schema fixes the model's input and output specs. The action space feeds both sides, which is why its box carries both colours.</desc>
  <rect width="700" height="620" fill="#ffffff"/>

  <defs>
    <!-- Action space feeds BOTH input (purple) and output (orange) -->
    <linearGradient id="spaceActionStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#f6c68a"/>
    </linearGradient>
    <linearGradient id="spaceActionFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2ebfa"/>
      <stop offset="1" stop-color="#fdf1e0"/>
    </linearGradient>
  </defs>

  <text x="350" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#6b4f9e">I/O schema construction</text>
  <text x="350" y="70" text-anchor="middle" font-size="13.5" font-weight="600" fill="#404040">Minari offline dataset spaces → DataSpec schema → Model I/O heads at build-time</text>

  <rect x="260" y="96" width="180" height="60" rx="14" fill="#f0f0f2" stroke="#b8b8be" stroke-width="2"/>
  <text x="350" y="121" text-anchor="middle" font-size="17" font-weight="700" fill="#404040">Your Dataset</text>
  <text x="350" y="141" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Minari offline</text>

  <path d="M350 156 V 174 H 200 V 184" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M350 174 H 500 V 184" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="200,196 193,182 207,182" fill="#404040"/>
  <polygon points="500,196 493,182 507,182" fill="#404040"/>

  <rect x="65" y="196" width="270" height="62" rx="14" fill="#f7f4fb" stroke="#c4a7e7" stroke-width="2"/>
  <text x="200" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4f9e">Observation Space</text>
  <text x="200" y="242" text-anchor="middle" font-size="13.5" fill="#8a8a8a">Box · Discrete · Dict …</text>

  <rect x="365" y="196" width="270" height="62" rx="14" fill="url(#spaceActionFill)" stroke="url(#spaceActionStroke)" stroke-width="2"/>
  <text x="500" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a1e">Action Space</text>
  <text x="500" y="242" text-anchor="middle" font-size="13" fill="#8a8a8a">Box · Discrete · MultiDiscrete · MultiBinary …</text>

  <path d="M200 258 V 276 H 500 V 258" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M350 276 V 286" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="350,298 343,284 357,284" fill="#404040"/>

  <rect x="240" y="298" width="220" height="74" rx="18" fill="#404040"/>
  <text x="350" y="328" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">schema</text>
  <text x="350" y="350" text-anchor="middle" font-size="13.5" fill="#c9c9c9">Gym SpaceSpec → DataSpec</text>

  <path d="M350 372 V 390 H 200 V 400" fill="none" stroke="#8f6fbf" stroke-width="3"/>
  <polygon points="200,412 193,398 207,398" fill="#8f6fbf"/>
  <path d="M350 390 H 500 V 400" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="500,412 493,398 507,398" fill="#c98a2e"/>

  <rect x="65" y="412" width="270" height="62" rx="14" fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2"/>
  <text x="200" y="437" text-anchor="middle" font-size="17" font-weight="700" fill="#6b4f9e">Input spec</text>
  <text x="200" y="458" text-anchor="middle" font-size="13.5" fill="#8a8a8a">state · action · bos</text>

  <rect x="365" y="412" width="270" height="62" rx="14" fill="#fdf1e0" stroke="#f6c68a" stroke-width="2"/>
  <text x="500" y="437" text-anchor="middle" font-size="17" font-weight="700" fill="#9a6a1e">Output spec</text>
  <text x="500" y="458" text-anchor="middle" font-size="13.5" fill="#8a8a8a">next action · next value · termination</text>

  <path d="M200 474 V 492 H 500 V 474" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M350 492 V 502" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="350,514 343,500 357,500" fill="#404040"/>

  <rect x="265" y="514" width="170" height="74" rx="18" fill="#404040"/>
  <text x="350" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Model</text>
  <text x="350" y="566" text-anchor="middle" font-size="13.5" fill="#c9c9c9">Causal GPT-RL θ</text>
</svg>
