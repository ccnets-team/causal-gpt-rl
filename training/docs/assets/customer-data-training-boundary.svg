<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1034 985" width="1034" height="985" font-family="Segoe UI, Arial, sans-serif">
  <title>Causal GPT-RL — Your Environment Stays With You</title>
  <desc>The data boundary of hosted training: you run your environment and controller, record trajectories, and package them as a Minari dataset. The dataset is the only thing that crosses to AWS hosted training; what comes back is a trained policy you deploy into the same environment, and can continue training from. The training job never connects to your environment.</desc>
  <rect width="1034" height="985" fill="#ffffff"/>

  <!-- ================= TITLE ================= -->
  <text x="517" y="58" text-anchor="middle" font-size="35" font-weight="700" fill="#404040">Causal GPT-RL: <tspan font-weight="600" fill="#d1544a">Your Environment Stays With You</tspan></text>

  <!-- ================= REGIONS (each hugs its own column; the corridor between them is neutral) ================= -->
  <rect x="40" y="94" width="434" height="866" rx="20" fill="#f9f7fc" stroke="#c4a7e7" stroke-width="2.5"/>
  <rect x="664" y="94" width="346" height="866" rx="20" fill="#fdf9f3" stroke="#f6c68a" stroke-width="2.5"/>

  <!-- the boundary itself — broken where the two crossings pass through it -->
  <line x1="569" y1="94" x2="569" y2="620" stroke="#b8b8be" stroke-width="2.5" stroke-dasharray="10 8"/>
  <line x1="569" y1="694" x2="569" y2="802" stroke="#b8b8be" stroke-width="2.5" stroke-dasharray="10 8"/>
  <line x1="569" y1="874" x2="569" y2="960" stroke="#b8b8be" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text transform="translate(586,210) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="3" fill="#9b9b9b">DATA BOUNDARY</text>

  <text x="280" y="136" text-anchor="middle" font-size="23" font-weight="700" fill="#6b4f9e">Customer side</text>

  <!-- ================= CUSTOMER: RECORDING LOOP (stacked) ================= -->
  <rect x="120" y="178" width="320" height="92" rx="16" fill="#ffffff" stroke="#c4a7e7" stroke-width="2.5"/>
  <text x="280" y="214" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">Your controller</text>
  <text x="280" y="238" text-anchor="middle" font-size="14" fill="#8a8a8a">Scripted policy · prior model</text>
  <text x="280" y="257" text-anchor="middle" font-size="14" fill="#8a8a8a">Human operator</text>

  <rect x="120" y="350" width="320" height="92" rx="16" fill="#ffffff" stroke="#c4a7e7" stroke-width="2.5"/>
  <text x="280" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="#404040">Your environment</text>
  <text x="280" y="410" text-anchor="middle" font-size="14" fill="#8a8a8a">Simulator · game engine</text>
  <text x="280" y="429" text-anchor="middle" font-size="14" fill="#8a8a8a">Robot · live system</text>

  <!-- controller -> environment (action) -->
  <path d="M190 270 V 344" fill="none" stroke="#8f6fbf" stroke-width="2.5"/>
  <polygon points="190,350 184,338 196,338" fill="#8f6fbf"/>
  <text x="198" y="302" text-anchor="start" font-size="14" fill="#8a8a8a">Action</text>
  <!-- environment -> controller (observation, reward) -->
  <path d="M370 350 V 276" fill="none" stroke="#8f6fbf" stroke-width="2.5"/>
  <polygon points="370,270 364,282 376,282" fill="#8f6fbf"/>
  <text x="362" y="334" text-anchor="end" font-size="14" fill="#8a8a8a">Observation · reward</text>

  <!-- interaction -> recorded trajectories -->
  <path d="M280 442 V 494" fill="none" stroke="#6b6b6b" stroke-width="2.5"/>
  <polygon points="280,502 272,490 288,490" fill="#404040"/>
  <text x="296" y="476" text-anchor="start" font-size="14" font-style="italic" font-weight="600" fill="#8f6fbf">You record</text>

  <rect x="120" y="502" width="320" height="88" rx="16" fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2"/>
  <text x="280" y="534" text-anchor="middle" font-size="19" font-weight="700" fill="#6b4f9e">Recorded trajectories</text>
  <text x="280" y="558" text-anchor="middle" font-size="14" fill="#8a8a8a">(observation, action, reward,</text>
  <text x="280" y="577" text-anchor="middle" font-size="14" fill="#8a8a8a">terminated, truncated)</text>

  <path d="M280 590 V 612" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="280,620 272,608 288,608" fill="#404040"/>

  <rect x="120" y="620" width="320" height="76" rx="16" fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2.5"/>
  <text x="280" y="650" text-anchor="middle" font-size="19" font-weight="700" fill="#6b4f9e">Minari dataset</text>
  <text x="280" y="675" text-anchor="middle" font-size="14" fill="#8a8a8a">Convert your data into this format</text>

  <!-- ================= CROSSING: DATASET UPLOAD ================= -->
  <path d="M440 658 H 679" fill="none" stroke="#8f6fbf" stroke-width="3.5"/>
  <polygon points="687,658 675,650 675,666" fill="#8f6fbf"/>
  <text x="569" y="638" text-anchor="middle" font-size="15.5" font-weight="700" fill="#6b4f9e">Dataset upload</text>
  <text x="569" y="682" text-anchor="middle" font-size="14" fill="#8a8a8a">S3 training channel</text>

  <!-- ================= AWS HOSTED TRAINING ================= -->
  <text x="837" y="136" text-anchor="middle" font-size="23" font-weight="700" fill="#9a6a1e">AWS hosted training</text>
  <text x="837" y="162" text-anchor="middle" font-size="14" fill="#8a8a8a">AWS Marketplace · SageMaker training job</text>

  <text x="837" y="216" text-anchor="middle" font-size="17.5" font-style="italic" font-weight="600" fill="#c98a2e">The job never connects</text>
  <text x="837" y="240" text-anchor="middle" font-size="17.5" font-style="italic" font-weight="600" fill="#c98a2e">to your environment,</text>
  <text x="837" y="270" text-anchor="middle" font-size="14.5" fill="#8a8a8a">so it cannot measure how the policy</text>
  <text x="837" y="291" text-anchor="middle" font-size="14.5" fill="#8a8a8a">performs at your task.</text>

  <rect x="687" y="616" width="300" height="84" rx="18" fill="#404040"/>
  <text x="837" y="650" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Offline training</text>
  <text x="837" y="677" text-anchor="middle" font-size="14" fill="#c9c9c9">Reads only the datasets you upload</text>

  <path d="M837 700 V 788" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="837,796 829,784 845,784" fill="#c98a2e"/>
  <text x="845" y="750" text-anchor="start" font-size="14" fill="#8a8a8a">Exported while it trains</text>

  <rect x="687" y="800" width="300" height="76" rx="18" fill="#fdf1e0" stroke="#f6c68a" stroke-width="2.5"/>
  <text x="837" y="830" text-anchor="middle" font-size="19" font-weight="700" fill="#9a6a1e">Policy bundle</text>
  <text x="837" y="855" text-anchor="middle" font-size="14" fill="#8a8a8a">Runs with the provided runtime library</text>

  <!-- ================= CROSSING: MODEL DELIVERY ================= -->
  <path d="M687 838 H 448" fill="none" stroke="#c98a2e" stroke-width="3.5"/>
  <polygon points="440,838 452,830 452,846" fill="#c98a2e"/>
  <text x="569" y="818" text-anchor="middle" font-size="15.5" font-weight="700" fill="#9a6a1e">Model delivery</text>
  <text x="569" y="862" text-anchor="middle" font-size="14" fill="#8a8a8a">Checkpoints · model.tar.gz</text>

  <!-- ================= CUSTOMER: DEPLOY ================= -->
  <rect x="120" y="800" width="320" height="76" rx="16" fill="#fdf1e0" stroke="#f6c68a" stroke-width="2.5"/>
  <text x="280" y="830" text-anchor="middle" font-size="19" font-weight="700" fill="#9a6a1e">Deploy &amp; evaluate</text>
  <text x="280" y="855" text-anchor="middle" font-size="14" fill="#8a8a8a">Scored in your environment, not ours</text>

  <!-- loop back into the environment -->
  <path d="M120 838 H 92 Q72 838 72 818 V 416 Q72 396 92 396 H 112" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="120,396 108,388 108,404" fill="#c98a2e"/>
  <text x="84" y="778" text-anchor="start" font-size="14" font-style="italic" font-weight="600" fill="#c98a2e">Back into the environment</text>

  <!-- ================= WHAT NEVER CROSSES ================= -->
  <line x1="72" y1="904" x2="380" y2="904" stroke="#e2d6f0" stroke-width="2"/>
  <text x="72" y="930" text-anchor="start" font-size="14.5" font-weight="700" fill="#6b4f9e">Nothing leaves your side</text>
  <text x="72" y="951" text-anchor="start" font-size="14.5" font-weight="700" fill="#6b4f9e">except the dataset you upload</text>
</svg>
