<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850"
  font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>Reinforcement Learning Loop</title>
  <desc>The standard reinforcement learning agent-environment loop: the agent sends an action to the environment, which returns an observation and a reward. Recording that loop accumulates a dataset — trajectories of steps, each a tuple of observation, action, reward, terminated and truncated.</desc>

  <rect width="1000" height="850" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="68" text-anchor="middle" font-size="42" font-weight="700" fill="#404040">
    Reinforcement Learning Loop
  </text>

  <!-- ============ THE LOOP (scaled down as one unit) ============ -->
  <g transform="translate(80,63) scale(0.7)">

    <!-- Cards -->
    <rect x="125" y="210" width="350" height="320" rx="16"
          fill="#ffffff" stroke="#404040" stroke-width="2.5"/>
    <rect x="725" y="210" width="350" height="320" rx="16"
          fill="#ffffff" stroke="#404040" stroke-width="2.5"/>

    <!-- Agent icon: line-art robot head -->
    <g stroke="#404040" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="300" y1="270" x2="300" y2="252"/>
      <circle cx="300" cy="244" r="7"/>
      <rect x="225" y="280" width="150" height="105" rx="34"/>
      <rect x="245" y="302" width="110" height="58" rx="22"/>
      <circle cx="274" cy="331" r="8" fill="#404040" stroke="none"/>
      <circle cx="326" cy="331" r="8" fill="#404040" stroke="none"/>
      <line x1="225" y1="310" x2="207" y2="310"/>
      <line x1="225" y1="354" x2="207" y2="354"/>
      <path d="M207 310 C193 317,193 347,207 354"/>
      <line x1="375" y1="310" x2="393" y2="310"/>
      <line x1="375" y1="354" x2="393" y2="354"/>
      <path d="M393 310 C407 317,407 347,393 354"/>
      <line x1="300" y1="385" x2="300" y2="407"/>
      <path d="M258 430 C258 407,342 407,342 430"/>
    </g>
    <text x="300" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#404040">
      Agent (Policy)
    </text>

    <!-- Environment icon: line-art landscape -->
    <g stroke="#404040" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <!-- mountain -->
      <path d="M790 383 L846 302 L922 383"/>
      <path d="M824 334 L845 314 L864 334 L876 321 L890 336"/>
      <!-- cloud -->
      <path d="M935 306
               C946 286,977 287,987 308
               C1006 305,1018 318,1018 333
               C1018 347,1007 356,992 356
               H934
               C920 356,910 348,910 336
               C910 323,921 313,935 306"/>
      <!-- ground -->
      <line x1="780" y1="408" x2="1020" y2="408"/>
      <!-- tree -->
      <line x1="973" y1="365" x2="973" y2="408"/>
      <path d="M973 330
               C957 330,949 340,951 350
               C940 354,938 368,946 376
               C954 384,965 381,973 377
               C982 383,995 382,1001 374
               C1009 363,1003 352,994 348
               C995 337,986 330,973 330"/>
    </g>
    <text x="900" y="470" text-anchor="middle" font-size="28" font-weight="700" fill="#404040">
      Environment
    </text>

    <!-- Top action arc — drawn after the cards, like the arcs below, so the
         opaque card does not paint over where the arrow lands -->
    <path d="M 410 210 C 485 95, 715 95, 790 210"
          fill="none" stroke="#c98a2e" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="790,210 773,202 779,220" fill="#c98a2e"/>
    <text x="600" y="111" text-anchor="middle" font-size="21" font-weight="600" fill="#9a6a1e">
      Action
    </text>

    <!-- Bottom observation arc (inner) -->
    <path d="M 790 530 C 735 635, 465 635, 410 530"
          fill="none" stroke="#8f6fbf" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="410,530 428,535 419,518" fill="#8f6fbf"/>
    <text x="600" y="642" text-anchor="middle" font-size="21" font-weight="600" fill="#6b4f9e">
      Observation
    </text>

    <!-- Bottom reward arc (outer) -->
    <path d="M 835 530 C 775 745, 425 745, 365 530"
          fill="none" stroke="#d1544a" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="365,530 383,536 373,518" fill="#d1544a"/>
    <text x="600" y="718" text-anchor="middle" font-size="21" font-weight="600" fill="#d1544a">
      Reward
    </text>

  </g>

  <!-- ============ The loop, recorded, accumulates into a dataset ============ -->
  <path d="M 500 591 V 631" fill="none" stroke="#8f6fbf" stroke-width="3.5"/>
  <polygon points="500,639 490,625 510,625" fill="#8f6fbf"/>
  <text x="522" y="619" text-anchor="start" font-size="19" font-style="italic" font-weight="600" fill="#6b4f9e">
    You record
  </text>

  <rect x="180" y="639" width="640" height="170" rx="18"
        fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2.5"/>

  <!-- dataset icon: stacked trajectories -->
  <g stroke="#6b4f9e" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="462" y="665" width="76" height="14" rx="7"/>
    <rect x="462" y="685" width="76" height="14" rx="7"/>
    <rect x="462" y="705" width="76" height="14" rx="7"/>
  </g>

  <text x="500" y="755" text-anchor="middle" font-size="26" font-weight="700" fill="#6b4f9e">
    Your dataset
  </text>
  <text x="500" y="785" text-anchor="middle" font-size="19" fill="#8a8a8a">
    Trajectories of (observation, action, reward, terminated, truncated)
  </text>
</svg>
