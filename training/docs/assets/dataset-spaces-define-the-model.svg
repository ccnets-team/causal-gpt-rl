<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1176" width="1060" height="1176" font-family="Segoe UI, Arial, sans-serif">
  <title>Causal GPT-RL — Your Dataset Spaces Define the Model</title>
  <desc>Autoregressive I/O convention and build-time I/O schema construction: Minari offline dataset spaces define the DataSpec schema, which defines the model's input and output heads.</desc>
  <rect width="1060" height="1176" fill="#ffffff"/>

  <defs>
    <!-- Action space feeds BOTH input (purple) and output (orange) -->
    <linearGradient id="spaceActionStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4a7e7"/>
      <stop offset="1" stop-color="#f6c68a"/>
    </linearGradient>
    <linearGradient id="spaceActionFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2ebfa"/>
      <stop offset="1" stop-color="#fdf1e0"/>
    </linearGradient>
  </defs>

  <!-- ================= TITLE ================= -->
  <text x="530" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#404040">Causal GPT-RL: <tspan font-weight="600" fill="#d1544a">Your Dataset Spaces Define the Model</tspan></text>

  <!-- ================= INPUT CONTEXT ================= -->
  <text x="275" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#8f6fbf">Input context</text>
  <text x="275" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#404040">autoregressive token sequence → x₁ … xₜ</text>

  <rect x="40" y="160" width="470" height="68" rx="34" fill="#404040"/>
  <circle cx="90" cy="194" r="22" fill="#c4a7e7"/>
  <text x="90" y="200" text-anchor="middle" font-style="italic" font-size="14" fill="#2b2b2b">x<tspan dy="5" font-size="10">1</tspan></text>
  <circle cx="156" cy="194" r="22" fill="#c4a7e7"/>
  <text x="156" y="200" text-anchor="middle" font-style="italic" font-size="14" fill="#2b2b2b">x<tspan dy="5" font-size="10">2</tspan></text>
  <circle cx="222" cy="194" r="22" fill="#c4a7e7"/>
  <text x="222" y="200" text-anchor="middle" font-style="italic" font-size="14" fill="#2b2b2b">x<tspan dy="5" font-size="10">3</tspan></text>
  <text x="288" y="203" text-anchor="middle" font-size="24" font-weight="700" fill="#c4a7e7">···</text>
  <circle cx="354" cy="194" r="22" fill="#c4a7e7"/>
  <text x="354" y="199" text-anchor="middle" font-style="italic" font-size="13" fill="#2b2b2b">x<tspan dy="5" font-size="9">t-1</tspan></text>
  <circle cx="440" cy="194" r="27" fill="#c4a7e7" stroke="#8f6fbf" stroke-width="4"/>
  <text x="440" y="201" text-anchor="middle" font-style="italic" font-size="17" font-weight="700" fill="#3a2a63">x<tspan dy="5" font-size="11">t</tspan></text>
  <text x="440" y="154" text-anchor="middle" font-size="13" font-weight="600" fill="#9b9b9b">latest</text>

  <path d="M510 194 H 552" fill="none" stroke="#404040" stroke-width="4"/>
  <polygon points="566,194 550,187 550,201" fill="#404040"/>

  <!-- ================= Causal GPT-RL ================= -->
  <rect x="566" y="154" width="224" height="80" rx="20" fill="#404040"/>
  <text x="678" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Causal GPT-RL</text>
  <text x="678" y="214" text-anchor="middle" font-size="13" fill="#c9c9c9">model θ · context x_{≤t}</text>

  <path d="M678 234 V 272" fill="none" stroke="#404040" stroke-width="4"/>
  <polygon points="678,284 670,268 686,268" fill="#404040"/>

  <!-- ================= OUTPUT (folded below the model) ================= -->
  <rect x="540" y="292" width="490" height="200" rx="14" fill="#fdf6ec" stroke="#f0dcc0" stroke-width="2"/>
  <text x="785" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#c98a2e">Output</text>
  <text x="785" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#404040">output token → (aₜ₊₁, Vₜ₊₁, eosₜ)</text>

  <circle cx="642" cy="396" r="27" fill="#f6c68a"/>
  <text x="642" y="403" text-anchor="middle" font-size="20" font-style="italic" fill="#2b2b2b">a<tspan dy="6" font-size="11">t+1</tspan></text>
  <circle cx="785" cy="396" r="27" fill="#f6c68a"/>
  <text x="785" y="403" text-anchor="middle" font-size="20" font-style="italic" fill="#2b2b2b">V<tspan dy="6" font-size="11">t+1</tspan></text>
  <circle cx="928" cy="396" r="27" fill="#f6c68a" stroke="#e0a860" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="928" y="402" text-anchor="middle" font-size="15" font-weight="700" fill="#2b2b2b">eos<tspan dy="6" font-size="10">t</tspan></text>

  <text x="642" y="446" text-anchor="middle" font-weight="600" font-size="12.5" fill="#404040">action at t+1</text>
  <text x="785" y="446" text-anchor="middle" font-weight="600" font-size="12.5" fill="#404040">state value at t+1</text>
  <text x="928" y="446" text-anchor="middle" font-weight="600" font-size="12.5" fill="#404040">episode-end probability</text>

  <text x="785" y="468" text-anchor="middle" font-size="12" fill="#9b6fbf">outputs: next action &amp; value aligned to (t+1)</text>
  <text x="785" y="485" text-anchor="middle" font-size="12" fill="#9b6fbf">termination: done label of transition (t)</text>

  <!-- ================= TOKEN EXPANSION ================= -->
  <rect x="40" y="292" width="480" height="180" rx="14" fill="#f7f4fb" stroke="#e2d6f0" stroke-width="2"/>
  <text x="64" y="324" text-anchor="start" font-size="16" font-weight="700" fill="#6b4f9e">at token   xₜ = [ sₜ , aₜ , bosₜ ]</text>

  <circle cx="120" cy="386" r="30" fill="#c4a7e7"/>
  <text x="120" y="393" text-anchor="middle" font-size="22" font-style="italic" fill="#2b2b2b">s<tspan dy="6" font-size="11">t</tspan></text>
  <circle cx="270" cy="386" r="30" fill="#c4a7e7"/>
  <text x="270" y="393" text-anchor="middle" font-size="22" font-style="italic" fill="#2b2b2b">a<tspan dy="6" font-size="11">t</tspan></text>
  <circle cx="420" cy="386" r="32" fill="#c4a7e7"/>
  <text x="420" y="392" text-anchor="middle" font-size="16" font-weight="700" fill="#2b2b2b">bos<tspan dy="6" font-size="10">t</tspan></text>

  <text x="120" y="442" text-anchor="middle" font-weight="600" font-size="13" fill="#404040">state at t</text>
  <text x="270" y="442" text-anchor="middle" font-weight="600" font-size="13" fill="#404040">action at t</text>
  <text x="420" y="442" text-anchor="middle" font-weight="600" font-size="13" fill="#404040">episode-start flag</text>

  <path d="M440 224 C 440 258, 330 250, 302 280" fill="none" stroke="#8f6fbf" stroke-width="2.5"/>
  <polygon points="300,292 292,276 308,277" fill="#8f6fbf"/>
  <text x="368" y="278" text-anchor="start" font-size="14" font-style="italic" font-weight="600" fill="#8f6fbf">expand</text>

  <!-- ================= COLOR KEY (one row) ================= -->
  <text x="40" y="523" text-anchor="start" font-size="14" font-weight="700" fill="#404040">Color key</text>
  <rect x="124" y="508" width="20" height="20" rx="6" fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2"/>
  <text x="152" y="523" text-anchor="start" font-weight="600" font-size="13" fill="#404040">Input side</text>
  <rect x="240" y="508" width="20" height="20" rx="6" fill="#fdf1e0" stroke="#f6c68a" stroke-width="2"/>
  <text x="268" y="523" text-anchor="start" font-weight="600" font-size="13" fill="#404040">Output side</text>
  <rect x="366" y="508" width="20" height="20" rx="6" fill="url(#spaceActionFill)" stroke="url(#spaceActionStroke)" stroke-width="2"/>
  <text x="394" y="523" text-anchor="start" font-weight="600" font-size="13" fill="#404040">Action — feeds both sides</text>

  <!-- ================= I/O SCHEMA CONSTRUCTION (top-down funnel) ================= -->
  <line x1="40" y1="558" x2="1020" y2="558" stroke="#e2d6f0" stroke-width="2"/>
  <text x="530" y="604" text-anchor="middle" font-size="26" font-weight="700" fill="#6b4f9e">I/O schema construction</text>
  <text x="530" y="630" text-anchor="middle" font-weight="600" font-size="13" fill="#404040">Minari offline dataset spaces → DataSpec schema → Model I/O heads at build-time</text>

  <rect x="440" y="652" width="180" height="60" rx="14" fill="#f0f0f2" stroke="#b8b8be" stroke-width="2"/>
  <text x="530" y="677" text-anchor="middle" font-size="16" font-weight="700" fill="#404040">Your Dataset</text>
  <text x="530" y="697" text-anchor="middle" font-size="12.5" fill="#8a8a8a">Minari offline</text>

  <path d="M530 712 V 730 H 360 V 740" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M530 730 H 700 V 740" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="360,752 353,738 367,738" fill="#404040"/>
  <polygon points="700,752 693,738 707,738" fill="#404040"/>

  <rect x="205" y="752" width="310" height="62" rx="14" fill="#f7f4fb" stroke="#c4a7e7" stroke-width="2"/>
  <text x="360" y="777" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4f9e">Observation Space</text>
  <text x="360" y="797" text-anchor="middle" font-size="12.5" fill="#8a8a8a">Box · Discrete · Dict …</text>

  <rect x="545" y="752" width="310" height="62" rx="14" fill="url(#spaceActionFill)" stroke="url(#spaceActionStroke)" stroke-width="2"/>
  <text x="700" y="777" text-anchor="middle" font-size="16" font-weight="700" fill="#9a6a1e">Action Space</text>
  <text x="700" y="797" text-anchor="middle" font-size="12.5" fill="#8a8a8a">Box · Discrete · MultiDiscrete · MultiBinary …</text>

  <path d="M360 814 V 832 H 700 V 814" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M530 832 V 842" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="530,854 523,840 537,840" fill="#404040"/>

  <rect x="420" y="854" width="220" height="74" rx="18" fill="#404040"/>
  <text x="530" y="884" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">schema</text>
  <text x="530" y="906" text-anchor="middle" font-size="12.5" fill="#c9c9c9">Gym SpaceSpec → DataSpec</text>

  <path d="M530 928 V 946 H 360 V 956" fill="none" stroke="#8f6fbf" stroke-width="3"/>
  <polygon points="360,968 353,954 367,954" fill="#8f6fbf"/>
  <path d="M530 946 H 700 V 956" fill="none" stroke="#c98a2e" stroke-width="3"/>
  <polygon points="700,968 693,954 707,954" fill="#c98a2e"/>

  <rect x="205" y="968" width="310" height="62" rx="14" fill="#f2ebfa" stroke="#c4a7e7" stroke-width="2"/>
  <text x="360" y="993" text-anchor="middle" font-size="16" font-weight="700" fill="#6b4f9e">Input spec</text>
  <text x="360" y="1013" text-anchor="middle" font-size="12.5" fill="#8a8a8a">state · action · bos</text>

  <rect x="545" y="968" width="310" height="62" rx="14" fill="#fdf1e0" stroke="#f6c68a" stroke-width="2"/>
  <text x="700" y="993" text-anchor="middle" font-size="16" font-weight="700" fill="#9a6a1e">Output spec</text>
  <text x="700" y="1013" text-anchor="middle" font-size="12.5" fill="#8a8a8a">next action · next value · termination</text>

  <path d="M360 1030 V 1048 H 700 V 1030" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <path d="M530 1048 V 1058" fill="none" stroke="#6b6b6b" stroke-width="3"/>
  <polygon points="530,1070 523,1056 537,1056" fill="#404040"/>

  <rect x="445" y="1070" width="170" height="74" rx="18" fill="#404040"/>
  <text x="530" y="1100" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Model</text>
  <text x="530" y="1122" text-anchor="middle" font-size="12.5" fill="#c9c9c9">Causal GPT-RL θ</text>
</svg>
